<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #15131d;
  color: #f7f3ff;
}

header {
  text-align: center;
  padding: 28px 14px;
  background: linear-gradient(135deg, #211b30, #302341);
  border-bottom: 1px solid #594774;
}

h1 {
  font-size: 1.4rem;
  margin: 0 0 8px;
  color: #e4d8ff;
  letter-spacing: 0.04em;
}

p {
  font-size: 0.85rem;
  color: #c2b4d8;
  margin: 0;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 14px;
}

.search {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #594774;
  border-radius: 14px;
  background: #221e2d;
  color: #f7f3ff;
  font-size: 16px;
  margin-bottom: 14px;
  outline: none;
}

.search:focus {
  border-color: #c9b6ff;
  box-shadow: 0 0 0 3px #c9b6ff25;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.card {
  background: #221e2d;
  border: 1px solid #46385f;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 5px 18px #00000025;
}

a {
  color: inherit;
  text-decoration: none;
}

.photo {
  aspect-ratio: 3 / 4;
  background: linear-gradient(145deg, #352744, #211b30 65%, #49365f);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px;
  color: #d7c5ff;
  font-size: 0.8rem;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.meta {
  padding: 9px;
}

.rank {
  font-size: 0.76rem;
  font-weight: 800;
  color: #c9b6ff;
}

.name {
  font-size: 0.85rem;
  font-weight: 700;
  overflow-wrap: anywhere;
  margin-top: 4px;
  color: #f7f3ff;
  line-height: 1.45;
}

.note {
  font-size: 0.8rem;
  line-height: 1.7;
  background: #221e2d;
  border: 1px solid #46385f;
  padding: 13px;
  border-radius: 14px;
  margin-top: 18px;
  color: #c2b4d8;
}

@media (min-width: 650px) {
  .grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
  }

  .meta {
    padding: 12px;
  }

  .name {
    font-size: 0.95rem;
  }
}

/* 1位・2位の特別カード */
.top-picks {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  margin: 18px 0 28px;
}

.featured-card {
  min-width: 0;
  overflow: hidden;
  background: #221e2d;
  border: 1px solid #8f79b8;
  border-radius: 18px;
  box-shadow: 0 8px 24px #00000035;
}

.featured-card:first-child {
  border-color: #c9b6ff;
  box-shadow: 0 0 0 1px #c9b6ff35,
              0 8px 24px #00000035;
}

.featured-photo {
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: #302341;
}

.featured-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.featured-meta {
  padding: 16px;
}

.featured-rank {
  color: #c9b6ff;
  font-weight: 800;
  font-size: 0.95rem;
}

.featured-name {
  color: #f7f3ff;
  font-size: clamp(1.1rem, 2.5vw, 1.7rem);
  font-weight: 800;
  margin: 8px 0 14px;
  overflow-wrap: anywhere;
}

.profile-button {

  border-radius: 12px;
  padding: 12px;
  background: #352744;
  color: #f7f3ff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.profile-button:hover {
  background: #49365f;
}

.profile-panel {
  padding: 14px;
  border-top: 1px solid #594774;
  color: #e5dcf4;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.profile-panel[hidden] {
  display: none;
}

.profile-panel h3 {
  color: #e0d2ff;
  font-size: 1rem;
  margin: 14px 0 4px;
}

.profile-panel p {
  color: #c2b4d8;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.profile-panel a {
  color: #d7c5ff;
  text-decoration: underline;
}

.profile-row {
  margin: 10px 0;
}

.profile-label {
  display: block;
  color: #c9b6ff;
  font-size: 0.8rem;
  font-weight: 700;
}

.profile-value {
  color: #f7f3ff;
  font-size: 0.9rem;
}

@media (max-width: 520px) {
  .top-picks {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .featured-photo {
    aspect-ratio: 4 / 3;
  }

.featured-card {

  background: linear-gradient(145deg, #302341, #1d1927 75%);

.featured-card:hover {
  transform: translateY(-4px);

.featured-card:first-child {

  text-align: center;
  color: #211b30;
  background: linear-gradient(90deg, #bca4ff, #f0e7ff, #bca4ff);
  font-weight: 900;
  letter-spacing: 0.12em;
}

.featured-card:nth-child(2)::before {
  content: "✦ NO.2 ✦";
  display: block;
  padding: 10px;
  text-align: center;
  color: #f7f3ff;
  background: linear-gradient(90deg, #49365f, #302341, #49365f);
  font-weight: 800;
  letter-spacing: 0.12em;
}

.featured-photo {
  aspect-ratio: 4 / 3;
  background: #211b30;
}

.featured-photo img {
  transition: transform 0.35s ease;
}

.featured-card:hover .featured-photo img {
  transform: scale(1.035);
}

.featured-meta {
  padding: 20px;
}

.featured-name {
  font-size: clamp(1.35rem, 3vw, 2rem);
  letter-spacing: 0.03em;
  line-height: 1.4;

.featured-rank {
  font-size: 1rem;
  letter-spacing: 0.1em;

.profile-button {
  border: 1px solid #a993d7;
  background: linear-gradient(135deg, #49365f, #352744);
  border-radius: 14px;
  padding: 14px;
  font-size: 0.95rem;
  transition: background 0.2s ease;
}

.profile-button:hover {
  background: linear-gradient(135deg, #654b83, #49365f);
}

.profile-panel {
  background: #1b1724;
  border-top: 1px solid #594774;
  padding: 18px;
  border-radius: 0 0 20px 20px;
}

.profile-panel h3 {
  border-left: 3px solid #c9b6ff;
  padding-left: 10px;

@media (max-width: 520px) {
  .top-picks {
    gap: 18px;
    margin: 18px 0 26px;
  }

  .featured-meta {
    padding: 16px;
  }

  .featured-name {
    font-size: 1.4rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .featured-card,
  .featured-photo img,
  .profile-button {
    transition: none;
  }

  .featured-card:hover {
    transform: none;
  }
}

function addProfileRow(parent, label, value) {
  const row = document.createElement("div");
  row.className = "profile-row";

  const title = document.createElement("span");
  title.className = "profile-label";
  title.textContent = label;

  const content = document.createElement("div");
  content.className = "profile-value";
  content.textContent = value || "未登録";

  row.append(title, content);
  parent.appendChild(row);
}

function makePhoto(person, className) {
  const photo = document.createElement("div");
  photo.className = className;

  if (person.photo) {
    const image = document.createElement("img");
    image.src = person.photo;
    image.alt = person.name;
    image.loading = "lazy";
    photo.appendChild(image);
  } else {
    photo.textContent = "写真URLを設定するとここに表示";
  }

  return photo;
}

  const officialTitle = document.createElement("h3");
  officialTitle.textContent = "公式サイト・掲載元";

  const officialLink = document.createElement("a");
  officialLink.href = person.link;
  officialLink.target = "_blank";
  officialLink.rel = "noopener noreferrer";
  officialLink.textContent = "公式サイト・掲載元を開く ↗";

  panel.append(officialTitle, officialLink);

  button.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
    button.textContent = panel.hidden
      ? "プロフィールを見る ＋"
      : "プロフィールを閉じる −";
  });

  meta.append(rank, name, button);
  card.append(meta, panel);

  return card;
}

function makeRegularCard(person) {
  const card = document.createElement("div");
  card.className = "card";

  const link = document.createElement("a");
  link.href = person.link;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  link.appendChild(makePhoto(person, "photo"));

  const meta = document.createElement("div");
  meta.className = "meta";

  const rank = document.createElement("div");
  rank.className = "rank";
  rank.textContent = "NO. " + person.rank;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = person.name;

  meta.append(rank, name);
  link.appendChild(meta);
  card.appendChild(link);

  return card;
}

function draw(q = "") {
  const grid = document.getElementById("grid");
  const topPicks = document.getElementById("topPicks");

  grid.replaceChildren();
  topPicks.replaceChildren();

  const query = q.trim();
  const filtered = people.filter(person =>
    person.name.includes(query)
  );

  if (!query) {
    topPicks.hidden = false;

    filtered
      .filter(person => person.rank === 1 || person.rank === 2)
      .sort((a, b) => a.rank - b.rank)
      .forEach(person => {
        topPicks.appendChild(makeFeaturedCard(person));
      });

    filtered
      .filter(person => person.rank >= 3)
      .sort((a, b) => a.rank - b.rank)
      .forEach(person => {
        grid.appendChild(makeRegularCard(person));
      });
  } else {
    topPicks.hidden = true;

    filtered
      .sort((a, b) => a.rank - b.rank)
      .forEach(person => {
        grid.appendChild(makeRegularCard(person));
      });
  }
}

document.getElementById("search").addEventListener("input", event => {
  draw(event.target.value);
});

draw();
</script></body></html>
