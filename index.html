<style>

</style></head><body><header><h1>💗 かいとの推しランキング</h1><p>TOP30 · 写真をタップすると掲載元へ</p></header>

/08/%E6%A3%AE%E8%84%87%E6%A2%A8%E3%80%85%E5%A4%8F%E5%AE%A3%E6%9D%90-scaled.jpg", "link": "https://platinumproduction.jp/talent/moriwakiririka/"}, {"rank": 24, "name": "大原優乃", "photo": "https://fam-fansite.imgix.net/shared_file/463/c727ec76-1407-4053-af0b-6afce4f3b703.jpg?auto=format&s=6418f743a71273562620c9eb7b29cc71", "link": "https://ohara-yuno.com/profile"}, {"rank": 25, "name": "一ノ瀬瑠菜", "photo": "https://fam-fansite.imgix.net/shared_file/13612/0e36a84e-a9ca-4589-ac45-8f98bbabe2c2.png?auto=format&q=90&s=8415413d12d321b1f5635ca4f2e25f05", "link": "https://luna-ichinose.com/"}, {"rank": 26, "name": "松島かのん", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=松島かのん+公式+プロフィール"}, {"rank": 27, "name": "井上和", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=井上和+乃木坂46+公式+プロフィール"}, {"rank": 28, "name": "冨里奈央", "photo": "", "link": "https://www.nogizaka46.com/s/n46/diary/MEMBER/list?ima=0000&cd=MEMBER"}, {"rank": 29, "name": "山本杏", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=山本杏+ヤングマガジン+公式+写真"}, {"rank": 30, "name": "松川星", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=松川星+公式+プロフィール"}];
function draw(q=''){const grid=document.getElementById('grid');grid.innerHTML='';people.filter(p=>p.name.includes(q)).forEach(p=>{const c=document.createElement('div');c.className='card';const a=document.createElement('a');a.href=p.link;a.target='_blank';a.rel='noopener';const ph=document.createElement('div');ph.className='photo';if(p.photo){const im=document.createElement('img');im.src=p.photo;im.alt=p.name;ph.appendChild(im)}else{ph.textContent='写真URLを設定すると\\nここに表示';}const m=document.createElement('div');m.className='meta';const r=document.createElement('div');r.className='rank';r.textContent='NO. '+p.rank;const n=document.createElement('div');n.className='name';n.textContent=p.name;m.append(r,n);a.append(ph,m);c.appendChild(a);grid.appendChild(c)})}
document.getElementById('search').addEventListener('input',e=>draw(e.target.value));draw();</script></body></html>
