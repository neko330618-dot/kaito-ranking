<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff7fa;color:#33232b}
header{text-align:center;padding:22px 12px;background:#ffeaf2}h1{font-size:1.35rem;margin:0 0 6px}p{font-size:.85rem;color:#806a73;margin:0}
main{max-width:1000px;margin:auto;padding:12px}.search{width:100%;padding:12px;border:1px solid #f1cad9;border-radius:12px;font-size:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid #f1d7e1;border-radius:13px;overflow:hidden}
a{color:inherit;text-decoration:none}.photo{aspect-ratio:3/4;background:linear-gradient(145deg,#ffe0ec,#fff7fa);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#a03b67;font-size:.8rem}
.photo img{width:100%;height:100%;object-fit:cover}.meta{padding:8px}.rank{font-size:.75rem;font-weight:800;color:#d8427b}.name{font-size:.85rem;font-weight:700;overflow-wrap:anywhere;margin-top:3px}
.note{font-size:.8rem;line-height:1.6;background:white;padding:12px;border-radius:12px;margin-top:16px;color:#806a73}
@media(min-width:650px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style></head><body><header><h1>💗 かいとの推しランキング</h1><p>TOP30 · 写真をタップすると掲載元へ</p></header>
<main><input class="search" id="search" placeholder="名前で検索" aria-label="名前で検索"><div class="grid" id="grid"></div>
<div class="note"><b>写真を設定するには</b><br>現在、人物ごとの掲載元リンクを登録したスターター版です。画像URLは未設定です。本人と確認できる公式写真や利用許諾された画像の直接URLを、下のコード内の各人物の <code>photo</code> に入力すると写真が表示されます。公開写真でも著作権は掲載元などにあるため、無断転載せず、掲載元の利用条件を守ってください。</div></main>
<script>const people = [{"rank": 1, "name": "鈴木愛理", "photo": "", "link": "https://www.airisuzuki-officialweb.com/"}, {"rank": 2, "name": "小松未可子", "photo": "https://hirata-office.jp/talent_profile/img/mikako_komatsu.jpg", "link": "https://hirata-office.jp/talent_profile/woman/mikako_komatsu.html"}, {"rank": 3, "name": "寺田蘭世", "photo": "https://img-mdpr.freetls.fastly.net/common/web/common/img_protect.png?quality=40&auto=webp", "link": "https://note.com/honeyrosiehouse"}, {"rank": 4, "name": "川津明日香", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=川津明日香+公式+プロフィール"}, {"rank": 5, "name": "志田音々", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=志田音々+公式+プロフィール"}, {"rank": 6, "name": "黒嵜菜々子", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=黒嵜菜々子+公式+プロフィール"}, {"rank": 7, "name": "齋藤飛鳥", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=齋藤飛鳥+公式+プロフィール"}, {"rank": 8, "name": "佐倉綾音", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=佐倉綾音+公式+プロフィール"}, {"rank": 9, "name": "鶴田りお（璃音）", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=鶴田りお+璃音+公式+写真"}, {"rank": 10, "name": "稲光亜依", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=稲光亜依+公式+写真"}, {"rank": 11, "name": "北岡果林", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=北岡果林+公式+写真"}, {"rank": 12, "name": "涼井菜生", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=涼井菜生+公式+写真"}, {"rank": 13, "name": "白石麻衣", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=白石麻衣+公式+プロフィール"}, {"rank": 14, "name": "菜那セシル", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=菜那セシル+公式+写真"}, {"rank": 15, "name": "冴木柚葉", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=冴木柚葉+公式+写真"}, {"rank": 16, "name": "谷口愛季", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=谷口愛季+櫻坂46+公式+プロフィール"}, {"rank": 17, "name": "佐々木ほのか", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=佐々木ほのか+公式+プロフィール"}, {"rank": 18, "name": "生田絵梨花", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=生田絵梨花+公式+プロフィール"}, {"rank": 19, "name": "小森香乃", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=小森香乃+公式+写真"}, {"rank": 20, "name": "石井優希", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=石井優希+制コレ22+公式+写真"}, {"rank": 21, "name": "松本麗世", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=松本麗世+公式+プロフィール"}, {"rank": 22, "name": "出口夏希", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=出口夏希+公式+プロフィール"}, {"rank": 23, "name": "森脇梨々夏", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=森脇梨々夏+公式+プロフィール"}, {"rank": 24, "name": "大原優乃", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=大原優乃+公式+プロフィール"}, {"rank": 25, "name": "一ノ瀬瑠菜", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=一ノ瀬瑠菜+公式+プロフィール"}, {"rank": 26, "name": "松島かのん", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=松島かのん+公式+プロフィール"}, {"rank": 27, "name": "井上和", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=井上和+乃木坂46+公式+プロフィール"}, {"rank": 28, "name": "冨里奈央", "photo": "", "link": "https://www.nogizaka46.com/s/n46/diary/MEMBER/list?ima=0000&cd=MEMBER"}, {"rank": 29, "name": "山本杏", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=山本杏+ヤングマガジン+公式+写真"}, {"rank": 30, "name": "松川星", "photo": "", "link": "https://www.google.com/search?tbm=isch&q=松川星+公式+プロフィール"}];
function draw(q=''){const grid=document.getElementById('grid');grid.innerHTML='';people.filter(p=>p.name.includes(q)).forEach(p=>{const c=document.createElement('div');c.className='card';const a=document.createElement('a');a.href=p.link;a.target='_blank';a.rel='noopener';const ph=document.createElement('div');ph.className='photo';if(p.photo){const im=document.createElement('img');im.src=p.photo;im.alt=p.name;ph.appendChild(im)}else{ph.textContent='写真URLを設定すると\\nここに表示';}const m=document.createElement('div');m.className='meta';const r=document.createElement('div');r.className='rank';r.textContent='NO. '+p.rank;const n=document.createElement('div');n.className='name';n.textContent=p.name;m.append(r,n);a.append(ph,m);c.appendChild(a);grid.appendChild(c)})}
document.getElementById('search').addEventListener('input',e=>draw(e.target.value));draw();</script></body></html>
